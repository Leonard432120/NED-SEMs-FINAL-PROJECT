<!DOCTYPE html>
<html>
<head>
<title>Add Student</title>

<link rel="stylesheet" href="/static/css/admin.css">
<link rel="stylesheet" href="/static/css/form.css">
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="header-left">
        <span class="dashboard-title">Headteacher Portal</span>
    </div>

    <div class="header-right">
        <div class="profile">
            <span class="header-name">{{ session.name }}</span>
            <img src="/static/images/user.png">
        </div>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="dashboard">

<!-- SIDEBAR -->
<div class="sidebar">

    <a href="/headteacher/dashboard">Dashboard</a>

    <div class="sidebar-group">
        <span onclick="toggleMenu('studentsMenu')">Students ▼</span>
        <div class="sidebar-sub" id="studentsMenu">
            <a href="/headteacher/add-student" class="active">Add Student</a>
            <a href="/headteacher/manage-students">View Students</a>
        </div>
    </div>

    <a href="#">Results</a>
    <a href="#">Performance</a>
    <a href="#">Reports</a>

</div>

<!-- CONTENT -->
<div class="content">

<h2>Add Student</h2>

<div class="card card-accent-blue">

<div class="form-container">

<form method="POST" action="/headteacher/add-student">

<div class="form-group">
<label>Student Name</label>
<input type="text" name="name" placeholder="Enter student name" required>
</div>

<div class="form-group">
<label>Class</label>
<select name="class" required>
<option value="">Select Class</option>
<option value="Form 1">Form 1</option>
<option value="Form 2">Form 2</option>
</select>
</div>

<button class="btn">Add Student</button>

</form>

</div>

</div>

</div>
</div>

<script>
function toggleMenu(id) {
    const menu = document.getElementById(id);
    menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
}
</script>

</body>
</html>
