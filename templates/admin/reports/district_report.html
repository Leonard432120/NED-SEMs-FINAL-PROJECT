{% extends "admin/base.html" %}

{% block content %}

<h2>📊 District Performance Report</h2>

<!-- FILTER -->
<form method="GET">
    <label>Select District</label>

    <select name="district">
        <option value="">All Districts</option>
        {% for d in districts_list %}
            <option value="{{ d.district }}"
                {% if selected_district == d.district %}selected{% endif %}>
                {{ d.district }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Filter</button>
</form>

<!-- TABLE -->
<div class="card">
    <h3>District Summary</h3>

    <table>
        <tr>
            <th>District</th>
            <th>Total Students</th>
            <th>Average Score</th>
        </tr>

        {% for d in districts %}
        <tr>
            <td>{{ d.district }}</td>
            <td>{{ d.total_students }}</td>
            <td>{{ d.avg_score|round(2) }}%</td>
        </tr>
        {% endfor %}
    </table>
</div>

{% endblock %}
