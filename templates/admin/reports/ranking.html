{% extends "admin/base.html" %}

{% block content %}

<h2>🏆 School Rankings</h2>

<div class="card">

<table>
<tr>
    <th>Rank</th>
    <th>School</th>
    <th>Average Score</th>
</tr>

{% for r in ranking %}
<tr>
    <td>{{ loop.index }}</td>
    <td>{{ r.school_name }}</td>
    <td>{{ r.avg_score|round(2) }}%</td>
</tr>
{% endfor %}

</table>

</div>

{% endblock %}
