<!DOCTYPE html>
<html>
<head>
<title>AI Anomalies</title>
<link rel="stylesheet" href="/static/css/admin.css">
<link rel="stylesheet" href="/static/css/form.css">
</head>

<body>

<div class="container">

<h2>🧠 AI Anomaly Detection</h2>

<div class="card">

{% if anomalies %}

<ul>
    {% for a in anomalies %}
        <li>⚠️ {{ a.message }}</li>
    {% endfor %}
</ul>

{% else %}
<p>No anomalies detected.</p>
{% endif %}

</div>

</div>

</body>
</html>
