{% extends "admin/base.html" %}
{% block content %}

<!-- ================= HEADER ================= -->
<h2 style="margin-bottom: 20px;">Edit User</h2>

<!-- ================= CARD ================= -->
<div class="card card-accent-blue">

    <div class="form-container">

        <form method="POST">

            <!-- NAME -->
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" value="{{ user.name }}" required>
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ user.email }}" required>
            </div>

            <!-- PHONE -->
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" value="{{ user.phone }}">
            </div>

            <!-- ROLE -->
            <div class="form-group">
                <label>Role</label>
                <select name="role" required>

                    <option value="admin"
                        {% if user.role == 'admin' %}selected{% endif %}>
                        Admin
                    </option>

                    <option value="teacher"
                        {% if user.role == 'teacher' %}selected{% endif %}>
                        Teacher
                    </option>

                    <option value="headteacher"
                        {% if user.role == 'headteacher' %}selected{% endif %}>
                        Headteacher
                    </option>

                    <option value="examination_officer"
                        {% if user.role == 'examination_officer' %}selected{% endif %}>
                        Exam Officer
                    </option>

                </select>
            </div>

            <!-- BUTTON -->
            <button type="submit" class="btn btn-dark">
                Update User
            </button>

        </form>

    </div>

</div>

{% endblock %}
