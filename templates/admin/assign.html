{% extends "admin/base.html" %}
{% block content %}

<h2>Assign Item Writers & Moderators</h2>

<div class="card card-accent-blue">

<div class="form-container">

<form method="POST">

<!-- ================= EXAM ================= -->
<div class="form-group dropdown-wrapper">

    <label>Select Exam</label>

    <input type="text"
           id="examSearch"
           placeholder="Search exam..."
           autocomplete="off"
           required>

    <input type="hidden" name="exam_id" id="exam_id">

    <div id="examList" class="dropdown-list">

        {% for e in exams %}
        <div class="dropdown-item" data-id="{{ e.exam_id }}">
            {{ e.exam_name }}
        </div>
        {% endfor %}

    </div>

</div>


<!-- ================= TEACHER ================= -->
<div class="form-group dropdown-wrapper">

    <label>Select Teacher</label>

    <input type="text"
           id="teacherSearch"
           placeholder="Search teacher..."
           autocomplete="off"
           required>

    <input type="hidden" name="teacher_id" id="teacher_id">

    <div id="teacherList" class="dropdown-list">

        {% for t in teachers %}
        <div class="dropdown-item" data-id="{{ t.user_id }}">
            {{ t.name }}
        </div>
        {% endfor %}

    </div>

</div>


<!-- ================= ROLE ================= -->
<div class="form-group dropdown-wrapper">

    <label>Assign Role</label>

    <input type="text"
           id="roleSearch"
           placeholder="Search role..."
           autocomplete="off"
           required>

    <input type="hidden" name="role" id="role">

    <div id="roleList" class="dropdown-list">

        <div class="dropdown-item" data-id="item_writer">
            Item Writer
        </div>

        <div class="dropdown-item" data-id="moderator">
            Moderator
        </div>

    </div>

</div>


<button type="submit" class="btn btn-dark">
    Assign
</button>

</form>

</div>
</div>

<!-- ================= STYLES ================= -->
<style>

.dropdown-wrapper {
    position: relative;
}

.dropdown-list {
    border: 1px solid #ccc;
    max-height: 200px;
    overflow-y: auto;
    display: none;
    background: #fff;
    position: absolute;
    width: 100%;
    z-index: 999;
    border-radius: 6px;
}

.dropdown-item {
    padding: 10px;
    cursor: pointer;
}

.dropdown-item:hover {
    background: #f0f0f0;
}

</style>


<!-- ================= SCRIPT: EXAM ================= -->
<script>
function setupDropdown(searchId, listId, hiddenId) {

    const searchInput = document.getElementById(searchId);
    const list = document.getElementById(listId);
    const hiddenInput = document.getElementById(hiddenId);
    const items = list.querySelectorAll(".dropdown-item");

    // show list
    searchInput.addEventListener("focus", () => {
        list.style.display = "block";
    });

    // filter items
    searchInput.addEventListener("keyup", () => {
        let value = searchInput.value.toLowerCase();

        items.forEach(item => {
            item.style.display =
                item.textContent.toLowerCase().includes(value)
                ? "block"
                : "none";
        });
    });

    // select item
    items.forEach(item => {
        item.addEventListener("click", () => {
            searchInput.value = item.textContent;
            hiddenInput.value = item.dataset.id;
            list.style.display = "none";
        });
    });
}


// ================= INITIALIZE ALL DROPDOWNS =================
setupDropdown("examSearch", "examList", "exam_id");
setupDropdown("teacherSearch", "teacherList", "teacher_id");
setupDropdown("roleSearch", "roleList", "role");


// ================= CLOSE WHEN CLICKING OUTSIDE =================
document.addEventListener("click", (e) => {
    if (!e.target.closest(".dropdown-wrapper")) {
        document.querySelectorAll(".dropdown-list").forEach(list => {
            list.style.display = "none";
        });
    }
});
</script>

{% endblock %}
