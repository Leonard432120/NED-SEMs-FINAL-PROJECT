{% extends "admin/base.html" %}
{% block content %}

<h2>Edit Subject</h2>

<div class="card card-accent-blue">

    <div class="form-container">

        <form method="POST">

            <div class="form-group">
                <label>Subject Name</label>
                <input type="text"
                       name="subject_name"
                       value="{{ subject.subject_name }}"
                       required>
            </div>

            <button type="submit" class="btn btn-dark">
                Update Subject
            </button>

        </form>

    </div>

</div>

{% endblock %}
