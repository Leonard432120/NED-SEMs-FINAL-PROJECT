<!DOCTYPE html>
<html>
<head>
<title>Create Exam</title>

<link rel="stylesheet" href="/static/css/admin.css">
<link rel="stylesheet" href="/static/css/form.css">

</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="header-left">
        <span class="dashboard-title">Admin Portal</span>
    </div>

    <div class="header-right">
        <div class="profile">
            <span>{{ session.name }}</span>
            <img src="/static/images/user.png">
        </div>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="dashboard">

<!-- SIDEBAR -->
<div class="sidebar">

    <a href="/admin/dashboard">Dashboard</a>
    <a href="/admin/add-user">Users</a>
    <a href="/admin/manage-schools">Schools</a>
    <a href="/admin/exams" class="active">Exams</a>

    <a href="/admin/create-exam">Create Exam</a>

</div>

<!-- CONTENT -->
<div class="content">

<h2>Create New Exam</h2>

<!-- FORM CARD -->
<div class="card card-accent-blue">

<div class="form-container">

<form method="POST">

<!-- TITLE -->
<div class="form-group">
<label>Paper Title</label>
<input type="text" name="title"
placeholder="Form 2 Mid-Term Exam Paper 1"
required>
</div>

<!-- SUBJECT -->
<div class="form-group">
<label>Subject</label>
<select name="subject_id" required>
<option value="">Select Subject</option>
{% for s in subjects %}
<option value="{{ s.subject_id }}">
    {{ s.subject_name }}
</option>
{% endfor %}
</select>
</div>

<!-- YEAR -->
<div class="form-group">
<label>Year</label>
<input type="number" name="year" placeholder="2026">
</div>

<!-- CLASS -->
<div class="form-group">
<label>Class</label>
<select name="class">
<option value="">Select Class</option>
<option value="Form 1">Form 1</option>
<option value="Form 2">Form 2</option>
</select>
</div>

<!-- EXAM DATE -->
<div class="form-group">
<label>Exam Date</label>
<input type="date" name="exam_date">
</div>

<!-- DURATION -->
<div class="form-group">
<label>Duration (minutes)</label>
<input type="number" name="duration_minutes" placeholder="60">
</div>

<!-- TOTAL MARKS -->
<div class="form-group">
<label>Total Marks</label>
<input type="number" name="total_marks" placeholder="100">
</div>

<!-- BUTTON -->
<button type="submit" class="btn" style="background: black;">
Create Exam
</button>

</form>

</div>

</div>

</div>
</div>

<!-- FOOTER -->
<footer class="footer">
<div class="footer-bottom">
© 2026 NED-SEMS
</div>
</footer>

</body>
</html>
