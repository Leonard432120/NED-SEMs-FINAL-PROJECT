<!DOCTYPE html>
<html>
<head>
    <title>Exams</title>
    <link rel="stylesheet" href="/static/css/admin.css">
</head>

<body>

<div class="header">
    <h3>Exams</h3>
    <a href="/admin/exams/create">+ Create Exam</a>
</div>

<div class="content">

<div class="card">

<table>
    <tr>
        <th>Title</th>
        <th>Subject</th>
        <th>Year</th>
        <th>Class</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>

    {% for e in exams %}
    <tr>
        <td>{{ e.title }}</td>
        <td>{{ e.subject_name }}</td>
        <td>{{ e.year }}</td>
        <td>{{ e.class }}</td>
        <td>{{ e.status }}</td>
        <td>
            <a class="btn btn-edit" href="/admin/exams/assign-item-writers/{{ e.exam_id }}">
                Writers
            </a>

            <a class="btn btn-edit" href="/admin/exams/assign-moderators/{{ e.exam_id }}">
                Moderators
            </a>
        </td>
    </tr>
    {% endfor %}

</table>

</div>

</div>

</body>
</html>
