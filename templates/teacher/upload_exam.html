<!DOCTYPE html>
<html>
<head>
    <title>Upload Exam</title>
    <link rel="stylesheet" href="/static/css/admin.css">
</head>

<body>

<div class="page-header">
    <div>
        <h1>Upload Exam Paper</h1>
        <p class="muted">Submit your exam for moderation</p>
    </div>
    <a href="/teacher/assigned_exams" class="btn-secondary">← Back</a>
</div>

<div class="container">

    <!-- Exam Info Card -->
    <div class="card">
        <h2>{{ exam.title }}</h2>

        <div class="info-grid">
            <div><span>Subject</span><b>{{ exam.subject_name }}</b></div>
            <div><span>Year</span><b>{{ exam.year }}</b></div>
            <div><span>Class</span><b>{{ exam.class }}</b></div>
        </div>
    </div>

    <!-- Upload Card -->
    <div class="card">
        <h3>Upload PDF Document</h3>
        <p class="muted">Only PDF files are allowed.</p>

        <form method="POST" enctype="multipart/form-data" class="upload-form">

            <div class="upload-box">
                <input type="file" name="exam_file" accept=".pdf" required>
                <p>Click to choose file</p>
            </div>

            <button type="submit" class="btn-primary">
                Upload & Submit for Moderation
            </button>

        </form>
    </div>

</div>

</body>
</html>
