<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examination moderation </title>
</head>
<body>
    <h2>Exams Waiting for Moderation</h2>

<table border="1" width="100%" cellpadding="10">
<tr>
    <th>Title</th>
    <th>Subject</th>
    <th>Teacher</th>
    <th>Year</th>
    <th>Class</th>
    <th>Status</th>
    <th>Action</th>
</tr>

{% for e in exams %}
<tr>
    <td>{{ e.title }}</td>
    <td>{{ e.subject_name }}</td>
    <td>{{ e.teacher_name }}</td>
    <td>{{ e.year }}</td>
    <td>{{ e.class }}</td>
    <td>{{ e.status }}</td>
    <td>
        <a href="/teacher/moderate/{{ e.exam_id }}">Review</a>
    </td>
</tr>
{% endfor %}

</table>
</body>
</html>
