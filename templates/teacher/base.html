<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Staff Portal{% endblock %}</title>

<link rel="stylesheet" href="/static/css/styles.css">
<link rel="stylesheet" href="/static/css/form.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="header">

    <div class="header-left">
        <span class="dashboard-title">EDM Staff Portal</span>
    </div>

    <div class="header-right">

        <div class="profile">

            <!-- Profile Name -->
            <span class="profile-name">{{ session.name }}</span>

            <!-- Profile Image -->
            <img src="/static/images/user.png" alt="Profile">

            <!-- Logout -->
            <a href="/logout" class="logout-btn">Logout</a>

        </div>

    </div>

</div>

<!-- ================= MAIN LAYOUT ================= -->
<div class="dashboard">

    <!-- ================= SIDEBAR ================= -->
    <div class="sidebar">

        <a href="/teacher/dashboard">Dashboard</a>

        <!-- TASKS -->
        <a href="/teacher/assigned_exams">Item Writer Tasks</a>
        <a href="/teacher/moderation-exams">Moderator Tasks</a>

        <!-- RESULTS -->
        <a href="/teacher/results">Results</a>

        <!-- SUBMISSIONS -->
        <a href="/teacher/my-submissions">My Submissions</a>

        <!-- PROFILE -->
        <a href="/teacher/profile">My Profile</a>

        <!-- OPTIONAL: ANALYTICS -->
        {% if exam is defined %}
            <a href="{{ url_for('teacher.analytics', exam_id=exam.exam_id) }}">
                AI Analytics
            </a>
        {% endif %}

    </div>

    <!-- ================= CONTENT ================= -->
    <div class="content">
        {% block content %}{% endblock %}
    </div>

</div>

</body>
</html>
